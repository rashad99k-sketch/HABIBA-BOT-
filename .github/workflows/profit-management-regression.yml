name: Profit Management Regression

on:
  pull_request:
    paths:
      - "ggpbot.py"
      - "ggp_profit_brain.py"
      - "ggp_market_intelligence.py"
      - "test_profit_brain.py"
      - ".github/workflows/profit-management-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-profit-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependency
        run: python -m pip install --upgrade pytest pandas
      - name: Compile management modules
        run: python -m py_compile ggpbot.py ggp_profit_brain.py ggp_market_intelligence.py test_profit_brain.py
      - name: Run profit-management regression tests
        run: python -m pytest -q test_profit_brain.py
