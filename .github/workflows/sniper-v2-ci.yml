name: Sniper V2 integration CI

on:
  push:
    branches:
      - feature/sniper-v2-safe-integration
      - "release/**"
  pull_request:
    branches:
      - main

# Keep one authoritative CI run per PR/branch. Rapid repair commits must not
# launch many competing full-regression suites and starve the newest revision.
concurrency:
  group: sniper-v2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAPER_MODE: "true"
      ENABLE_LIVE_TRADING: "false"
      BINGX_API_KEY: ""
      BINGX_API_SECRET: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Static compile
        run: python -m compileall -q .

      - name: Runtime preflight
        run: python preflight.py

      - name: Native stop and adaptive entry tests
        run: python -m pytest -q test_native_sl_management_integration.py test_neon_adaptive_entry.py test_ema9_vwap_soft_gate.py

      - name: Full regression suite
        run: python -m pytest -q
